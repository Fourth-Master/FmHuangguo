name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Resolve Swift Package dependencies (MPVKit/libmpv)
        run: |
          xcodebuild -resolvePackageDependencies -project FmHuangguo.xcodeproj -scheme FmHuangguo

      - name: Build (unsigned, arm64)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project FmHuangguo.xcodeproj \
            -scheme FmHuangguo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            build 2>&1 | tee build/xcodebuild.log | tail -n 300

      - name: Print compile errors on failure
        if: failure()
        run: |
          grep -E "\.swift:[0-9]+:[0-9]+: error:" build/xcodebuild.log | head -n 20 || true

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log

      - name: Package IPA (ldid pseudo-sign for TrollStore)
        run: |
          APP=$(find build/DD/Build/Products -type d -name "FmHuangguo.app" | head -n 1)
          echo "APP=$APP"
          test -n "$APP"
          # 巨魔/TrollStore 要求 app 至少有伪签名（_CodeSignature），
          # 完全未签名的 app 解析报 302 "Unable to locate Info.plist"
          brew install ldid
          which ldid
          # 1) 嵌入 framework 的二进制逐个伪签名（ldid -S 只嵌签名，无 CodeResources）
          find "$APP/Frameworks" -maxdepth 1 -name "*.framework" | while read -r fw; do
            BIN="$fw/$(basename "$fw" .framework)"
            [ -f "$BIN" ] && ldid -S "$BIN" && echo "sign bin $(basename "$fw") OK"
          done
          # 2) 以 bundle 模式签整个 .app：生成主二进制签名 + _CodeSignature/CodeResources
          ldid -S "$APP" && echo "sign bundle OK"
          # 3) 校验主 app 签名目录存在（不存在则直接失败）
          if [ -d "$APP/_CodeSignature" ]; then
            echo "main app _CodeSignature OK"
          else
            echo "::error::主 app 未生成 _CodeSignature"
            exit 1
          fi
          ls -la "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry FmHuangguo-1.3.11.ipa Payload
          ls -lh FmHuangguo-1.3.11.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FmHuangguo-ipa
          path: build/FmHuangguo-1.3.11.ipa
          if-no-files-found: error

      - name: Publish to Release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes-src.md <<'NOTES'
          Fm黄果 iOS 短剧播放器 v1.3.11（伪签名 ipa，需自行签名安装）

          - 修复历史/收藏的更新提醒不显示（进度保存曾清空检测基准，
            已修复并自动补记老数据的基准）
          - 收藏卡片新增观看信息：看到第几集 + 时间 + 进度条，
            集数标签同步显示最新更新集数
          - 设置页倍速输入键盘增加"完成"收起按钮
          - mpv（FFmpeg）单内核：OpenGL ES3 渲染 + VideoToolbox 硬解，
            画面色彩正确、高倍速音画同步
          - 全新 App 图标；深浅配色、热门标签、离线缓存、每日更新检测
          - 支持 iOS 15.4+

          安装方式：使用 Sideloadly / AltStore / 爱思助手 等工具对 ipa 自签安装。
          NOTES
          sed 's/^  //' /tmp/notes-src.md > /tmp/release-notes.md
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest build/FmHuangguo-1.3.11.ipa --clobber
          else
            gh release create latest build/FmHuangguo-1.3.11.ipa \
              --title "Fm黄果 v1.3.11" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

      - name: Make repository public (构建时公开)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH repos/$GITHUB_REPOSITORY -f private=false \
            && echo "仓库已公开" \
            || echo "::warning::GITHUB_TOKEN 无法修改可见性，请手动将仓库设为 Public"
